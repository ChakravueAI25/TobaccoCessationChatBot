[alembic]
script_location = db/migrations
prepend_sys_path = .
# Intentionally empty. db/migrations/env.py takes the URL from api.app.config.Settings,
# which reads .env, so migrations and the service can never target different databases.
# A real-looking value here is worse than none: it becomes a silent fallback, which is
# how this repo produced `password authentication failed for user "unused"` while .env
# was correct all along. Also note ConfigParser treats % as interpolation, so a
# percent-encoded password cannot live in this file at all.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s